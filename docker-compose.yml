version: '3.8'

services:
  # Nginx Load Balancer & Reverse Proxy
  nginx-lb:
    image: nginx:alpine
    container_name: cystem_nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2

  # Backend Instance 1
  backend-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cystem_backend_1
    environment:
      - DATABASE_URL=postgresql://cystem_user:cystem_secure_pass@db:5432/cystem_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=cystem_prod_master_secret_2026
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Backend Instance 2 (Redundancy & Load Distribution)
  backend-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cystem_backend_2
    environment:
      - DATABASE_URL=postgresql://cystem_user:cystem_secure_pass@db:5432/cystem_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=cystem_prod_master_secret_2026
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Primary PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cystem_postgres_db
    environment:
      POSTGRES_USER: cystem_user
      POSTGRES_PASSWORD: cystem_secure_pass
      POSTGRES_DB: cystem_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis Caching & Queue Broker
  redis:
    image: redis:alpine
    container_name: cystem_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Automated Database Backup Service (Dumps every 6 hours)
  db-backup:
    image: postgres:15-alpine
    container_name: cystem_db_backup
    depends_on:
      - db
    environment:
      - PGHOST=db
      - PGUSER=cystem_user
      - PGPASSWORD=cystem_secure_pass
      - PGDATABASE=cystem_db
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c "echo 'Starting automated PostgreSQL 6-hour backup loop...' &&
             while true; do
               filename=/backups/cystem_backup_$$(date +%Y%m%d_%H%M%S).sql;
               pg_dump > $$filename;
               echo 'Database backup saved successfully to $$filename';
               sleep 21600;
             done"
    restart: unless-stopped

volumes:
  pgdata:
